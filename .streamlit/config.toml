# Kept in sync with phase6/.streamlit/config.toml by hand — Streamlit
# Community Cloud always uses the repo root as its working directory, even
# though the app's entrypoint is phase6/app.py, so it only ever reads this
# copy (docs: "Community Cloud only recognizes one .streamlit/config.toml
# file at the root"). The phase6/ copy still applies for local dev, where
# `streamlit run app.py` is typically launched from inside phase6/.

[server]
# Default "watchdog" file watcher walks imported modules' file paths to decide
# what to watch, and hits transformers' optional torchvision import along the
# way -- logging a ModuleNotFoundError traceback on every check. "poll" just
# stats file mtimes instead, which sidesteps that entirely (QA-5/R-6).
fileWatcherType = "poll"

[client]
# R-26 (round 4 UX benchmark, UX-23): the default "Deploy" button + hamburger
# menu were visible on every screen, reading as an exposed dev tool rather
# than a shipped product. "minimal" keeps only what a user actually needs
# (the rerun/stop controls), dropping Deploy/Settings/"Report a bug"/etc.
toolbarMode = "minimal"

[theme]
# Design-alignment pass (2026-11-24, DESIGN.md H1): Peacock Teal replaces the
# earlier saffron/terracotta accent (R-26) to match DESIGN.md's §2 color
# tokens. Deliberately does NOT set `base`, so light/dark still follows the
# viewer's own system preference as before -- only the accent color is
# opinionated, not the whole palette.
primaryColor = "#0E7C86"

# UI/UX review (2026-10-24), theming migration: fonts, pill-shaped buttons
# and the light/dark accent now live here instead of injected CSS, so they
# survive Streamlit upgrades and the dark-mode variants are handled by
# Streamlit itself rather than a hand-rolled `@media` query. The app's own
# bespoke --wp-* tokens (badge pills, secondary-accent, card borders) still
# need a short CSS block in app.py -- native theme keys don't model those --
# but fonts/radius/accent no longer have to.
# Design-alignment pass (2026-11-24, DESIGN.md H4/H5): DESIGN.md §3's type
# pairing -- Baloo 2 (display), Manrope (body), IBM Plex Mono (utility/data)
# -- replaces the prior Plus Jakarta Sans/Fraunces/JetBrains Mono trio.
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap"
headingFont = "'Baloo 2':https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap"
# Positional per heading level (h1, h2, h3, ...), not "load these weights" --
# DESIGN.md §3 specifies Baloo 2 at 700/800, with 700 the main display weight
# and 800 reserved for the gradient-clipped h1 brand title (both weights are
# loaded above so neither is browser-synthesized).
headingFontWeights = [700]
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
# DESIGN.md §4: 8px ("medium") is the default radius for cards/buttons/chips
# -- the 999px pill is reserved for the mic button and status chips only,
# not every button. Replaces the earlier "full" (pill-everywhere) setting.
buttonRadius = "medium"
baseRadius = "medium"

[theme.light]
primaryColor = "#0E7C86"
# Design-alignment pass (2026-11-24, DESIGN.md M1): Handloom White / Charcoal
# Slate -- neither key was set before, so the app fell back to Streamlit's
# stock white/near-black regardless of the accent/font work above.
backgroundColor = "#EDE7D6"
textColor = "#26241F"
secondaryBackgroundColor = "#E4DCC9"

[theme.dark]
# Lightened Peacock Teal for legibility on the dark surface -- same role the
# old terracotta tint played for --wp-accent, now native so Streamlit's own
# widgets (sliders, toggles, tabs) pick it up too, not just custom elements.
primaryColor = "#2AA7B0"
# Design-alignment pass (2026-11-24, DESIGN.md M1): Indigo Night page.
backgroundColor = "#1B2A4A"
textColor = "#EDE7D6"
secondaryBackgroundColor = "#243655"
